<!DOCTYPE html>
<html>
<head>
  <title>Verification Successful</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 400px;
      margin: 50px auto;
      padding: 20px;
      border: 1px solid #ddd;
      border-radius: 5px;
      text-align: center;
    }
    h1 {
      color: #28a745;
      margin-bottom: 20px;
    }
    .success-icon {
      font-size: 48px;
      color: #28a745;
      margin-bottom: 20px;
    }
    p {
      color: #333;
      line-height: 1.6;
      margin-bottom: 15px;
    }
    .email-display {
      background-color: #f8f9fa;
      padding: 10px;
      border-radius: 4px;
      margin: 15px 0;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="success-icon">✓</div>
  <h1>Email Verification Successful</h1>
  <p>Thank you for verifying your email address.</p>
  <div class="email-display">Email: {{email}}</div>
  <p>Your account is now active and ready to use.</p>
</body>
</html>
