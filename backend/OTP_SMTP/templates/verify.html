<!DOCTYPE html>
<html>
<head>
  <title>Verify OTP</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 400px;
      margin: 50px auto;
      padding: 20px;
      border: 1px solid #ddd;
      border-radius: 5px;
    }
    h2 {
      color: #333;
      text-align: center;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    input[type="text"] {
      width: 100%;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 16px;
      text-align: center;
      letter-spacing: 2px;
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
      margin-bottom: 10px;
    }
    button:hover {
      background-color: #0056b3;
    }
    .resend-btn {
      background-color: #6c757d;
      font-size: 14px;
    }
    .resend-btn:hover {
      background-color: #545b62;
    }
    .message {
      margin-top: 15px;
      padding: 10px;
      border-radius: 4px;
      text-align: center;
    }
    .success {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    .error {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    .info {
      background-color: #d1ecf1;
      color: #0c5460;
      border: 1px solid #bee5eb;
    }
    .email-display {
      background-color: #f8f9fa;
      padding: 10px;
      border-radius: 4px;
      text-align: center;
      margin-bottom: 15px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h2>Verify Your Email</h2>
  <div class="email-display">Email: {{email}}</div>
  <form method="POST" action="/verify-otp">
    <input type="hidden" name="email" value="{{email}}" />
    <div class="form-group">
      <label for="otp">Enter OTP:</label>
      <input type="text" id="otp" name="otp" required maxlength="6" placeholder="000000" pattern="[0-9]{6}" />
    </div>
    <button type="submit">Verify OTP</button>
  </form>
  <form method="POST" action="/resend-otp">
    <input type="hidden" name="email" value="{{email}}" />
    <button type="submit" class="resend-btn">Resend OTP</button>
  </form>
  <div class="message info">
    Please check your email for the 6-digit OTP. It will expire in 10 minutes.
  </div>
</body>
</html>
